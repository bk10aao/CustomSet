plugins {
    id 'java'
    id 'jacoco'
    id 'me.champeau.jmh' version '0.7.2'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.jfree:jfreechart:1.5.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.8.1'

    // JMH dependencies (optional if using the plugin, but good for explicit annotation processing)
    jmh 'org.openjdk.jmh:jmh-core:1.37'
    jmhAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17) // Adjust to your Java version if needed
    }
}

test {
    useJUnitPlatform()

    // Generate JaCoCo report after tests complete
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.12'
    reportsDirectory = layout.buildDirectory.dir('reports/jacoco')
}

jacocoTestReport {
    dependsOn test

    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }

    // Exclude inner, anonymous, and synthetic classes
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/*$*'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport

    violationRules {
        rule {
            element = 'BUNDLE'

            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }

    // Apply the same exclusions used by the report
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                    '**/*$*'
            ])
        }))
    }
}

// Fail the build if line coverage is below 80%
check.dependsOn jacocoTestCoverageVerification

// Convenience task: ./gradlew coverage
tasks.register('coverage') {
    group = 'Verification'
    description = 'Runs tests, generates JaCoCo reports, and fails if line coverage is below 80%.'
    dependsOn jacocoTestCoverageVerification
}

jmh {
    includes = ['*CustomSetV1Benchmark*']
    fork = 1
    iterations = 5
    warmupIterations = 3
    profilers = ['gc']
}